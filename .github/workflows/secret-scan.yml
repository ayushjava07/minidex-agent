name: Secret Scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scan tracked files for secrets
        run: npm run check:secrets
